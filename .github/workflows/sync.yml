name: Sync forformat release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-forformat-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Find complete PyPI release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          python - "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from urllib.request import urlopen

          output = sys.argv[1]
          with urlopen("https://pypi.org/pypi/forformat/json") as response:
              data = json.load(response)

          version = data["info"]["version"]
          if re.fullmatch(r"\d+\.\d+\.\d+", version) is None:
              raise SystemExit(f"unexpected forformat version from PyPI: {version!r}")

          filenames = {
              item["filename"]
              for item in data["releases"].get(version, [])
              if not item.get("yanked", False)
          }
          required_platforms = (
              "manylinux_2_17_x86_64.musllinux_1_2_x86_64.whl",
              "manylinux_2_17_aarch64.musllinux_1_2_aarch64.whl",
              "macosx_10_12_x86_64.whl",
              "macosx_11_0_arm64.whl",
              "win_amd64.whl",
              "win_arm64.whl",
          )
          missing = [
              platform
              for platform in required_platforms
              if not any(filename.endswith(platform) for filename in filenames)
          ]

          with open(output, "a", encoding="utf-8") as handle:
              if missing:
                  print(
                      f"forformat {version} is not fully published yet; missing wheels: "
                      + ", ".join(missing)
                  )
                  handle.write("complete=false\n")
              else:
                  handle.write("complete=true\n")
                  handle.write(f"version={version}\n")
          PY

      - name: Check mirror state
        id: state
        if: steps.release.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          tag="v$version"

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
          fi

          if [[ "$tag_exists" == true ]]; then
            tag_pinned=$(
              git show "$tag:pyproject.toml" | python -c '
          import sys
          import tomllib

          dependencies = tomllib.loads(sys.stdin.read())["project"]["dependencies"]
          pins = [item.split("==", 1)[1] for item in dependencies if item.startswith("forformat==")]
          if len(pins) != 1:
              raise SystemExit("expected exactly one forformat dependency pin in existing tag")
          print(pins[0])
          '
            )

            if [[ "$tag_pinned" != "$version" ]]; then
              echo "$tag already exists but its pyproject.toml pins forformat==$tag_pinned" >&2
              exit 1
            fi

            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update dependency pin
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.release.outputs.version }}" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^(\s*"forformat==)[^"]+(",\s*)$')
          updated, count = pattern.subn(
              lambda match: f"{match.group(1)}{version}{match.group(2)}",
              text,
          )
          if count != 1:
              raise SystemExit(f"expected one forformat dependency pin, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Verify release and hooks
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"

          python -m pip install --upgrade pip pre-commit
          python -m pip install .
          test "$(forformat --version)" = "forformat $version"
          pre-commit validate-manifest .pre-commit-hooks.yaml

          cat > smoke.f90 <<'F90'
          MODULE Smoke
          CONTAINS
          SUBROUTINE Run()
          END SUBROUTINE Run
          END MODULE Smoke
          F90

          pre-commit try-repo . forformat --files smoke.f90
          pre-commit try-repo . forformat-check --files smoke.f90
          grep -Fxq 'module Smoke' smoke.f90
          rm smoke.f90

      - name: Commit and tag release
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          tag="v$version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- pyproject.toml; then
            git add pyproject.toml
            git commit -m "Sync forformat $version"
          fi

          git tag -a "$tag" -m "forformat $version"
          git push origin HEAD:master
          git push origin "$tag"
